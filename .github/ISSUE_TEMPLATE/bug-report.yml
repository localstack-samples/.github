name: Sample bug report
description: A sample does not deploy, does not work, or its test fails
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with a sample. If LocalStack itself behaves differently from the cloud provider, please report it in [localstack/localstack](https://github.com/localstack/localstack/issues) instead.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues of this repository
          required: true
  - type: input
    attributes:
      label: Sample
      description: If this repository holds several samples, which one? Give its folder or name.
      placeholder: e.g. samples/web-app-sql-database/python
  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and at which step of the README?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      placeholder: |
        lstk start
        make deploy
        make test
      render: shell
    validations:
      required: true
  - type: dropdown
    attributes:
      label: How did you start LocalStack?
      options:
        - lstk
        - localstack CLI
        - Docker Compose
        - docker run
        - In CI
        - Other (please describe below)
    validations:
      required: true
  - type: input
    attributes:
      label: LocalStack version
      description: The image tag or version, from the startup logs or `curl localhost:4566/_localstack/info`.
      placeholder: e.g. localstack/localstack-pro:2026.10.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, and versions of the tools the sample uses (Terraform, CDK, SAM, Node.js, Python and so on).
      value: |
        - OS:
        - Tools:
  - type: textarea
    attributes:
      label: Logs and error output
      description: The failing command's output, and the relevant LocalStack logs (`lstk logs`). Remove any secrets first.
      render: shell
